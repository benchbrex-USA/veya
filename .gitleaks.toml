# gitleaks configuration (used by gitleaks-action and the working-tree scan in
# .github/workflows/security.yml). Start from the default rule set and allowlist
# only reviewed false positives. Never allowlist a real credential: remove it
# from the tree and rotate it instead.

title = "veya gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Reviewed false positives"
regexTarget = "match"
regexes = [
  # generic-api-key matches SHA-256 file digests whose JSON key contains
  # "tokenizer" (artifacts/release/manifest*.json tokenizer_files and
  # prospective_blind_config.template.json tokenizer_version_sha256). The value is
  # a public 64-hex content hash of a tokenizer file, not a credential. Reviewed
  # 2026-10-07 (5 findings).
  '''tokenizer[A-Za-z0-9_./-]*"\s*:\s*"[0-9a-f]{64}"''',
  # generic-api-key matches Cloudflare account IDs (32 hex) under keys like
  # account_id / authenticated_account_id in read-only inventory dumps. These
  # are public account identifiers, not API tokens. The finding that failed the
  # 2026-10-12 scheduled Security run was in git history on
  # backup/local-drive-20261007 (artifacts/deployment/cloudflare/account-inventory.json).
  # Reviewed 2026-10-13.
  '''(?:authenticated_)?account_id"\s*:\s*"[0-9a-f]{32}"''',
]
