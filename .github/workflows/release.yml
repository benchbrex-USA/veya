name: Release

# MANUAL ONLY. This repository is proprietary (all rights reserved). Publishing
# to PyPI makes the package source code public and permanently downloadable;
# PyPI does not allow re-uploading a deleted version. Do not run this workflow
# unless the owner has explicitly decided to publish this code publicly.
#
# Automatic publishing on `v*` tag pushes was removed on 2026-10-07. To publish:
#   Actions -> Release -> Run workflow, choose the `v*` TAG (not a branch) under
#   "Use workflow from", and set confirm_public_pypi_publish to true.
# Without both, the guard job fails and nothing is built, uploaded or released.
# The build verifies that the pyproject version matches the tag, uploads to PyPI
# and creates a GitHub Release.
#
# PyPI setup (once): PyPI -> Publishing -> add a Trusted Publisher for
#   owner benchbrex-USA, repo veya, workflow release.yml, environment pypi
# Then no API token ever lives in GitHub secrets.

on:
  workflow_dispatch:
    inputs:
      confirm_public_pypi_publish:
        description: "I understand this publishes proprietary code publicly on PyPI (must be true)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write        # create the GitHub Release
  id-token: write        # PyPI trusted publishing

env:
  USE_TF: "0"
  USE_TORCH: "1"

jobs:
  guard:
    name: confirm public publish
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation and a v* tag
        env:
          CONFIRM: ${{ inputs.confirm_public_pypi_publish }}
        run: |
          if [ "$CONFIRM" != "true" ]; then
            echo "::error::confirm_public_pypi_publish must be true. This repository is proprietary; publishing to PyPI makes the code public."
            exit 1
          fi
          case "$GITHUB_REF" in
            refs/tags/v*) echo "Publishing $GITHUB_REF_NAME (confirmed)." ;;
            *) echo "::error::Run this workflow from a v* tag, not $GITHUB_REF."; exit 1 ;;
          esac

  build:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip build twine
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      - name: Tests must pass before anything is published
        run: |
          python tests/test_router.py
          python tests/test_criteria.py
          python tests/test_email.py
          python tests/test_download.py
          python tests/test_shortlist.py
          python tests/test_decision_model.py
          python tests/test_packaging.py

      - name: Build
        run: python -m build

      - name: Version matches the tag
        # guard guarantees a v* tag ref
        run: |
          pkg=$(python -c "import re;print(re.search(r'version = \"(.*)\"', open('pyproject.toml').read()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          echo "pyproject=$pkg tag=$tag"
          test "$pkg" = "$tag" || { echo "::error::pyproject version $pkg does not match tag $tag"; exit 1; }

      - run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: [guard, build]
    if: inputs.confirm_public_pypi_publish && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # Needs a Trusted Publisher on PyPI (Publishing -> add: owner benchbrex-USA,
      # repo veya, workflow release.yml, environment pypi). Until that exists the
      # exchange fails; skip-existing also makes a re-run safe after a manual upload.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github_release:
    needs: [guard, build]
    if: inputs.confirm_public_pypi_publish && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists - uploading artifacts to it"
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
