name: Release Candidate Gate

# G21 release-candidate gate: everything a version tag must clear before
# release.yml publishes it. Triggered by version tags. workflow_dispatch can
# additionally run the production evidence gate, which needs prospective
# evaluation data and therefore never runs automatically on a tag push.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      run_production_gate:
        description: "Run full production evidence gate"
        type: boolean
        default: false

env:
  # Same guards as ci.yml: Veya is torch-only (TF's abseil runtime can deadlock
  # model construction when TensorFlow is importable) and the offline tests
  # import the research.veyabench namespace package, so the repo root must be
  # on sys.path.
  USE_TF: "0"
  USE_TORCH: "1"
  TOKENIZERS_PARALLELISM: "false"
  PYTHONPATH: ${{ github.workspace }}

jobs:
  release-candidate-gate:
    name: release candidate gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch first (same choice as ci.yml): the default Linux
          # wheel is the CUDA build and ~2 GB; the CPU wheel satisfies the
          # torch dependency declared by `pip install -e ".[train]"`.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[train]"
          pip install pytest

      - name: Run full test suite
        run: pytest --tb=short -q

      - name: Artifact integrity validation
        run: pytest tests/test_artifact_integrity.py -v

      - name: License inventory check
        run: |
          python -c "
          import json, sys
          inv = json.load(open('artifacts/release/license_inventory.json'))
          blockers = [p for p in inv.get('runtime_dependencies', []) if p.get('status') == 'REQUIRES_LEGAL_REVIEW']
          if blockers:
              print(f'WARNING: {len(blockers)} packages need legal review:')
              for b in blockers:
                  print(f'  - {b[\"package\"]} ({b.get(\"license\", \"unknown\")})')
          print(f'License check complete: {len(inv.get(\"runtime_dependencies\", []))} packages scanned')
          "

      - name: Freeze record validation
        run: |
          python -c "
          import json, pathlib
          p = pathlib.Path('artifacts/release')
          for f in ['manifest.json', 'selective_policy.json', 'production_scope.json']:
              assert (p / f).exists(), f'{f} missing from release artifacts'
              json.loads((p / f).read_text())
              print(f'  ✓ {f} valid')
          print('Freeze record validation passed')
          "

      - name: Docker build validation
        run: |
          if [ -f Dockerfile ]; then
            docker build --target production -t veya:rc-test .
            echo "Docker build succeeded"
          else
            echo "No Dockerfile found, skipping"
          fi

  production-evidence-gate:
    # Manual trigger only - the full blind evaluation needs prospective data,
    # so this job never runs on a tag push. Trigger via workflow_dispatch with
    # run_production_gate=true.
    if: github.event_name == 'workflow_dispatch' && inputs.run_production_gate
    runs-on: ubuntu-latest
    steps:
      - run: echo "Production evidence gate requires manual trigger with prospective evaluation data"
