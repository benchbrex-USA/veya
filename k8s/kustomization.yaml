apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: veya-base

resources:
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - configmap.yaml

commonLabels:
  app.kubernetes.io/name: veya
  app.kubernetes.io/part-of: veya-decision-engine

images:
  - name: veya
    newName: veya
    newTag: latest
