[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veya"
version = "0.3.5"
description = "Fast, non-autoregressive System 1 decision engine with calibrated probabilities"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "Veya Dynamics" }
]
keywords = ["decision-model", "rlcd", "calibration", "system-one", "routing", "guardrails", "moderation", "triage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Upper bounds cap the next major of each dep: they let patch/minor upgrades
# flow (dependabot) while stopping a surprise major from silently breaking a
# pinned checkpoint. Caps are set one major above what the test suite runs on
# (torch 2.x, transformers 5.x, numpy 2.x, safetensors 0.x, hub 1.x).
dependencies = [
    "torch>=2.0.0,<3",
    "transformers>=4.48.0,<6",
    "safetensors>=0.4.0,<1",
    "huggingface_hub>=0.20.0,<2",
    "numpy>=1.20.0,<3",
]

[project.optional-dependencies]
# The reference trainer in veYa/train.py streams the HF typed-decisions dataset;
# the pure training math and the shipped runtime do not need it.
train = ["datasets>=2.14.0,<4"]

[tool.setuptools]
# assets/, research/ and notebooks/ sit in the root, so auto-discovery bails out.
packages = ["veya", "veya.experimental", "web"]

[tool.setuptools.package-data]
web = ["static/*"]

[project.urls]
Homepage = "https://huggingface.co/veyadynamics/veya"
Demo = "https://huggingface.co/spaces/veyadynamics/veya-demo"
